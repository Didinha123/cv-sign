<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDA Açaí - Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }

  /* DASHBOARD */
  .topbar {
    background: linear-gradient(135deg, #4a1942, #c0392b);
    color: white; padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h2 { font-size: 1.1rem; }

  /* TABS */
  .tabs {
    display: flex; background: white; border-bottom: 2px solid #eee; position: sticky; top: 0; z-index: 10;
  }
  .tab {
    flex: 1; padding: 14px; text-align: center; cursor: pointer;
    font-weight: 600; color: #888; border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }
  .tab.ativo { color: #4a1942; border-bottom-color: #4a1942; }

  .tab-content { display: none; padding: 16px; }
  .tab-content.ativo { display: block; }

  /* CARDS DE PRODUTO */
  .produto-card {
    background: white; border-radius: 12px; margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden;
  }
  .produto-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; cursor: pointer; user-select: none;
  }
  .produto-nome { font-weight: 700; font-size: 1rem; color: #4a1942; }
  .produto-cat { font-size: 0.75rem; color: #888; margin-top: 2px; }
  .chevron { transition: transform 0.2s; font-size: 0.8rem; color: #888; }
  .produto-card.aberto .chevron { transform: rotate(180deg); }

  .produto-linhas { display: none; border-top: 1px solid #f0f0f0; }
  .produto-card.aberto .produto-linhas { display: block; }

  .linha-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid #f9f9f9;
  }
  .linha-tamanho { font-size: 0.85rem; font-weight: 600; min-width: 56px; color: #555; }

  .toggle-btn {
    padding: 4px 10px; border-radius: 20px; border: none; cursor: pointer;
    font-size: 0.75rem; font-weight: 600;
  }
  .toggle-btn.sim { background: #d4edda; color: #155724; }
  .toggle-btn.nao { background: #f8d7da; color: #721c24; }

  .preco-input {
    width: 80px; padding: 4px 8px; border: 1px solid #ddd; border-radius: 6px;
    font-size: 0.85rem; text-align: center;
  }
  .save-btn {
    padding: 4px 10px; background: #4a1942; color: white; border: none;
    border-radius: 6px; font-size: 0.75rem; cursor: pointer;
  }
  .del-btn {
    padding: 4px 8px; background: #fee; color: #c0392b; border: 1px solid #fcc;
    border-radius: 6px; font-size: 0.75rem; cursor: pointer; margin-left: auto;
  }

  .desc-row { padding: 6px 16px 12px; }
  .desc-input {
    width: 100%; padding: 6px 10px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 0.85rem; resize: none;
  }
  .desc-save { margin-top: 6px; float: right; }

  .img-preview-mini {
    width: 40px; height: 40px; border-radius: 6px; object-fit: cover;
    border: 1px solid #eee;
  }
  .sem-img { font-size: 1.4rem; }

  /* FORM NOVO PRODUTO */
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #555; font-size: 0.9rem; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 14px; border: 2px solid #eee; border-radius: 10px;
    font-size: 0.95rem; outline: none;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: #4a1942;
  }

  .tamanho-linha {
    display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px;
    margin-bottom: 8px; align-items: center;
  }
  .tamanho-linha input { padding: 8px 10px; font-size: 0.85rem; }
  .rm-tam { background: #fee; color: #c0392b; border: 1px solid #fcc; border-radius: 8px; padding: 8px; cursor: pointer; }
  .add-tam-btn {
    background: #f0e8f0; color: #4a1942; border: 2px dashed #4a1942;
    border-radius: 10px; padding: 10px; width: 100%; cursor: pointer;
    font-weight: 600; font-size: 0.9rem; margin-bottom: 16px;
  }

  .img-upload-area {
    border: 2px dashed #ccc; border-radius: 12px; padding: 24px;
    text-align: center; cursor: pointer; transition: border-color 0.2s;
    position: relative;
  }
  .img-upload-area:hover { border-color: #4a1942; }
  .img-upload-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  #img-preview { max-width: 100%; max-height: 180px; border-radius: 10px; margin-top: 12px; display: none; }
  .upload-progress { display: none; color: #4a1942; font-weight: 600; margin-top: 8px; }

  .btn-salvar {
    width: 100%; padding: 14px; background: linear-gradient(135deg, #4a1942, #c0392b);
    color: white; border: none; border-radius: 12px; font-size: 1rem;
    font-weight: 700; cursor: pointer; margin-top: 8px;
  }
  .btn-salvar:disabled { opacity: 0.6; cursor: not-allowed; }

  .loading { text-align: center; padding: 40px; color: #888; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #333; color: white; padding: 12px 24px; border-radius: 10px;
    font-size: 0.9rem; z-index: 999; opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.sucesso { background: #27ae60; }
  .toast.erro { background: #c0392b; }

  .tamanho-label { font-size: 0.75rem; color: #888; text-align: center; }
</style>
</head>
<body>

<div id="dashboard">
  <div class="topbar">
    <h2>🍇 TDA Açaí — Admin</h2>
  </div>

  <div class="tabs">
    <div class="tab ativo" onclick="mudarTab('produtos')">📋 Produtos</div>
    <div class="tab" onclick="mudarTab('novo')">➕ Novo Produto</div>
  </div>

  <!-- ABA PRODUTOS -->
  <div class="tab-content ativo" id="tab-produtos">
    <div class="loading" id="loading-produtos">Carregando produtos...</div>
    <div id="lista-produtos"></div>
  </div>

  <!-- ABA NOVO PRODUTO -->
  <div class="tab-content" id="tab-novo">
    <div class="form-group">
      <label>Nome do Produto</label>
      <input type="text" id="novo-nome" placeholder="Ex: Copo Especial">
    </div>
    <div class="form-group">
      <label>Categoria</label>
      <select id="novo-categoria">
        <option value="Copo Individual">Copo Individual</option>
        <option value="Combo">Combo</option>
        <option value="Garrafa">Garrafa</option>
      </select>
    </div>
    <div class="form-group">
      <label>Descrição</label>
      <textarea id="novo-descricao" rows="2" placeholder="Ingredientes ou descrição"></textarea>
    </div>

    <div class="form-group">
      <label>Tamanhos e Preços</label>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:4px;margin-bottom:4px;">
        <span class="tamanho-label">Tamanho</span>
        <span class="tamanho-label">Preço (R$)</span>
        <span class="tamanho-label">Preço Original</span>
        <span></span>
      </div>
      <div id="tamanhos-lista">
        <div class="tamanho-linha">
          <input type="text" placeholder="300ml" class="tam-tamanho">
          <input type="number" placeholder="18,90" step="0.01" class="tam-preco">
          <input type="number" placeholder="(opcional)" step="0.01" class="tam-preco-orig">
          <button class="rm-tam" onclick="removerTamanho(this)">✕</button>
        </div>
      </div>
      <button class="add-tam-btn" onclick="adicionarTamanho()">+ Adicionar Tamanho</button>
    </div>

    <div class="form-group">
      <label>Foto do Produto</label>
      <div class="img-upload-area" onclick="document.getElementById('file-input').click()">
        <div id="upload-placeholder">📷 Toque para escolher uma foto</div>
        <input type="file" id="file-input" accept="image/*" onchange="previewImagem(this)">
        <img id="img-preview">
      </div>
      <div class="upload-progress" id="upload-progress">⬆️ Enviando imagem...</div>
    </div>

    <button class="btn-salvar" id="btn-salvar" onclick="salvarNovoProduto()">✅ Salvar Produto</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var imagemBase64 = '';
var imagemMime = '';
var imagemNome = '';

// ─── TABS ────────────────────────────────────────────────────────────────────

function mudarTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t, i) {
    t.classList.toggle('ativo', (i === 0 && tab === 'produtos') || (i === 1 && tab === 'novo'));
  });
  document.getElementById('tab-produtos').classList.toggle('ativo', tab === 'produtos');
  document.getElementById('tab-novo').classList.toggle('ativo', tab === 'novo');
}

// ─── CARREGAR PRODUTOS ───────────────────────────────────────────────────────

function carregarProdutos() {
  document.getElementById('loading-produtos').style.display = 'block';
  document.getElementById('lista-produtos').innerHTML = '';
  google.script.run
    .withSuccessHandler(renderizarProdutos)
    .withFailureHandler(function(e) {
      document.getElementById('loading-produtos').textContent = 'Erro ao carregar: ' + e.message;
    })
    .adminListarProdutos();
}

function renderizarProdutos(produtos) {
  document.getElementById('loading-produtos').style.display = 'none';
  var lista = document.getElementById('lista-produtos');
  lista.innerHTML = '';

  var grupos = {};
  produtos.forEach(function(p) {
    if (!grupos[p.produto]) grupos[p.produto] = [];
    grupos[p.produto].push(p);
  });

  Object.keys(grupos).forEach(function(nome) {
    var linhas = grupos[nome];
    var primeiraLinha = linhas[0];
    var card = document.createElement('div');
    card.className = 'produto-card';

    var imgHtml = primeiraLinha.imagem
      ? '<img class="img-preview-mini" src="' + primeiraLinha.imagem + '" onerror="this.style.display=\'none\'">'
      : '<span class="sem-img">🍇</span>';

    var linhasHtml = linhas.map(function(l) {
      return '<div class="linha-item">' +
        '<span class="linha-tamanho">' + (l.tamanho || 'Único') + '</span>' +
        '<button class="toggle-btn ' + (l.disponivel ? 'sim' : 'nao') + '" ' +
          'onclick="toggleDisponivel(' + l.rowIndex + ', this)">' +
          (l.disponivel ? '✅ Sim' : '❌ Não') + '</button>' +
        'R$ <input class="preco-input" type="number" step="0.01" value="' + l.preco.toFixed(2) + '" ' +
          'id="preco-' + l.rowIndex + '">' +
        '<button class="save-btn" onclick="salvarPreco(' + l.rowIndex + ')">💾</button>' +
        '<button class="del-btn" onclick="deletarLinha(' + l.rowIndex + ', \'' + nome.replace(/'/g, '') + '\')">🗑️</button>' +
        '</div>';
    }).join('');

    card.innerHTML =
      '<div class="produto-header" onclick="toggleCard(this)">' +
        imgHtml +
        '<div style="flex:1;margin-left:10px">' +
          '<div class="produto-nome">' + nome + '</div>' +
          '<div class="produto-cat">' + (primeiraLinha.categoria || '') + '</div>' +
        '</div>' +
        '<span class="chevron">▼</span>' +
      '</div>' +
      '<div class="produto-linhas">' +
        linhasHtml +
        '<div class="desc-row">' +
          '<textarea class="desc-input" rows="2" id="desc-' + primeiraLinha.rowIndex + '">' +
            (primeiraLinha.descricao || '') + '</textarea>' +
          '<button class="save-btn desc-save" onclick="salvarDesc(' + primeiraLinha.rowIndex + ', \'' + nome.replace(/'/g, '') + '\')">💾 Descrição</button>' +
        '</div>' +
      '</div>';

    lista.appendChild(card);
  });
}

function toggleCard(header) {
  header.parentElement.classList.toggle('aberto');
}

// ─── AÇÕES ───────────────────────────────────────────────────────────────────

function toggleDisponivel(rowIndex, btn) {
  google.script.run
    .withSuccessHandler(function() {
      var eSim = btn.classList.contains('sim');
      btn.className = 'toggle-btn ' + (eSim ? 'nao' : 'sim');
      btn.textContent = eSim ? '❌ Não' : '✅ Sim';
      toast('Disponibilidade atualizada!', 'sucesso');
    })
    .withFailureHandler(function() { toast('Erro ao atualizar', 'erro'); })
    .adminToggleDisponivel(rowIndex);
}

function salvarPreco(rowIndex) {
  var val = document.getElementById('preco-' + rowIndex).value;
  var formatado = 'R$ ' + parseFloat(val).toFixed(2).replace('.', ',');
  google.script.run
    .withSuccessHandler(function() { toast('Preço salvo!', 'sucesso'); })
    .withFailureHandler(function() { toast('Erro ao salvar', 'erro'); })
    .adminAtualizarCelula(rowIndex, 3, formatado);
}

function salvarDesc(rowIndex) {
  var val = document.getElementById('desc-' + rowIndex).value;
  google.script.run
    .withSuccessHandler(function() { toast('Descrição salva!', 'sucesso'); })
    .withFailureHandler(function() { toast('Erro ao salvar', 'erro'); })
    .adminAtualizarCelula(rowIndex, 6, val);
}

function deletarLinha(rowIndex, nome) {
  if (!confirm('Excluir a linha de "' + nome + '"?')) return;
  google.script.run
    .withSuccessHandler(function() {
      toast('Produto excluído!', 'sucesso');
      setTimeout(carregarProdutos, 600);
    })
    .withFailureHandler(function() { toast('Erro ao excluir', 'erro'); })
    .adminDeletarProduto(rowIndex);
}

// ─── NOVO PRODUTO ────────────────────────────────────────────────────────────

function adicionarTamanho() {
  var div = document.createElement('div');
  div.className = 'tamanho-linha';
  div.innerHTML =
    '<input type="text" placeholder="500ml" class="tam-tamanho">' +
    '<input type="number" placeholder="26,00" step="0.01" class="tam-preco">' +
    '<input type="number" placeholder="(opcional)" step="0.01" class="tam-preco-orig">' +
    '<button class="rm-tam" onclick="removerTamanho(this)">✕</button>';
  document.getElementById('tamanhos-lista').appendChild(div);
}

function removerTamanho(btn) {
  var lista = document.getElementById('tamanhos-lista');
  if (lista.children.length > 1) btn.parentElement.remove();
}

function previewImagem(input) {
  var file = input.files[0];
  if (!file) return;
  imagemMime = file.type;
  imagemNome = file.name;
  var reader = new FileReader();
  reader.onload = function(e) {
    var dataUrl = e.target.result;
    imagemBase64 = dataUrl.split(',')[1];
    document.getElementById('img-preview').src = dataUrl;
    document.getElementById('img-preview').style.display = 'block';
    document.getElementById('upload-placeholder').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function salvarNovoProduto() {
  var nome = document.getElementById('novo-nome').value.trim();
  var categoria = document.getElementById('novo-categoria').value;
  var descricao = document.getElementById('novo-descricao').value.trim();

  if (!nome) { toast('Informe o nome do produto', 'erro'); return; }

  var tamanhos = [];
  document.querySelectorAll('.tamanho-linha').forEach(function(linha) {
    var tam = linha.querySelector('.tam-tamanho').value.trim();
    var preco = linha.querySelector('.tam-preco').value;
    var precoOrig = linha.querySelector('.tam-preco-orig').value;
    if (tam && preco) tamanhos.push({ tamanho: tam, preco: preco, precoOriginal: precoOrig || '' });
  });

  if (tamanhos.length === 0) { toast('Adicione ao menos um tamanho e preço', 'erro'); return; }

  var btn = document.getElementById('btn-salvar');
  btn.disabled = true;

  function salvar(urlImagem) {
    var dados = { produto: nome, categoria: categoria, descricao: descricao, tamanhos: tamanhos, imagem: urlImagem };
    google.script.run
      .withSuccessHandler(function() {
        toast('Produto salvo com sucesso!', 'sucesso');
        btn.disabled = false;
        limparFormulario();
        mudarTab('produtos');
        carregarProdutos();
      })
      .withFailureHandler(function(e) {
        toast('Erro ao salvar: ' + e.message, 'erro');
        btn.disabled = false;
      })
      .adminSalvarNovoProduto(dados);
  }

  if (imagemBase64) {
    document.getElementById('upload-progress').style.display = 'block';
    google.script.run
      .withSuccessHandler(function(res) {
        document.getElementById('upload-progress').style.display = 'none';
        if (res.ok) salvar(res.url);
        else { toast('Erro no upload: ' + res.erro, 'erro'); btn.disabled = false; }
      })
      .withFailureHandler(function(e) {
        document.getElementById('upload-progress').style.display = 'none';
        toast('Erro no upload: ' + e.message, 'erro');
        btn.disabled = false;
      })
      .adminUploadImagem(imagemBase64, imagemNome, imagemMime);
  } else {
    salvar('');
  }
}

function limparFormulario() {
  document.getElementById('novo-nome').value = '';
  document.getElementById('novo-descricao').value = '';
  document.getElementById('tamanhos-lista').innerHTML =
    '<div class="tamanho-linha">' +
    '<input type="text" placeholder="300ml" class="tam-tamanho">' +
    '<input type="number" placeholder="18,90" step="0.01" class="tam-preco">' +
    '<input type="number" placeholder="(opcional)" step="0.01" class="tam-preco-orig">' +
    '<button class="rm-tam" onclick="removerTamanho(this)">✕</button>' +
    '</div>';
  document.getElementById('img-preview').style.display = 'none';
  document.getElementById('upload-placeholder').style.display = 'block';
  document.getElementById('file-input').value = '';
  imagemBase64 = '';
}

// ─── TOAST ───────────────────────────────────────────────────────────────────

function toast(msg, tipo) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (tipo || '');
  setTimeout(function() { t.className = 'toast'; }, 2800);
}

// Inicia carregando os produtos
carregarProdutos();
</script>
</body>
</html>
