<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDA Açaí — Admin</title>
<style>
:root {
  --purple: #6e2c7c;
  --purple-dark: #4a1a54;
  --purple-light: #f5eeff;
  --pink: #e63946;
  --bg: #f4f5f7;
  --white: #ffffff;
  --text: #2b2d42;
  --text-light: #6b7280;
  --border: #e5e7eb;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 12px;
  --radius-sm: 8px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); padding-bottom:40px; }

/* TOPBAR */
.topbar { background:var(--purple); padding:0 16px; height:56px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
.topbar-logo { color:white; font-weight:800; font-size:1.1rem; cursor:pointer; user-select:none; }
.topbar-sub { color:rgba(255,255,255,0.7); font-size:0.75rem; }

/* TABS */
.tabs { display:flex; background:white; border-bottom:2px solid var(--border); position:sticky; top:0; z-index:100; }
.tab { flex:1; padding:14px; text-align:center; cursor:pointer; font-weight:600; color:var(--text-light); border-bottom:3px solid transparent; transition:all 0.2s; font-size:0.9rem; }
.tab.ativo { color:var(--purple); border-bottom-color:var(--purple); }
.tab.oculto { display:none; }
.tab-content { display:none; }
.tab-content.ativo { display:block; }

/* SEÇÃO */
.section-title { font-size:0.85rem; font-weight:700; color:var(--text-light); text-transform:uppercase; letter-spacing:.05em; padding:16px 16px 8px; }

/* PRODUCT CARDS ADMIN */
.prod-card { background:white; border-bottom:1px solid var(--border); overflow:hidden; }
.prod-card-header { display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; }
.prod-card-img { width:60px; height:60px; border-radius:var(--radius-sm); object-fit:cover; background:var(--bg); flex-shrink:0; }
.prod-card-img-placeholder { width:60px; height:60px; border-radius:var(--radius-sm); background:var(--purple-light); display:flex; align-items:center; justify-content:center; font-size:1.6rem; flex-shrink:0; }
.prod-card-info { flex:1; min-width:0; }
.prod-card-name { font-weight:700; color:var(--text); font-size:0.95rem; }
.prod-card-cat { font-size:0.75rem; color:var(--text-light); margin-top:2px; }
.prod-card-chevron { color:var(--text-light); font-size:0.8rem; transition:transform 0.2s; }
.prod-card.aberto .prod-card-chevron { transform:rotate(180deg); }

.prod-card-body { display:none; border-top:1px solid var(--border); background:var(--bg); }
.prod-card.aberto .prod-card-body { display:block; }

.size-row { display:flex; align-items:center; gap:8px; padding:10px 16px; background:white; border-bottom:1px solid var(--bg); flex-wrap:wrap; }
.size-label { font-size:0.82rem; font-weight:700; min-width:54px; color:var(--text); }

.toggle-btn { padding:5px 12px; border-radius:50px; border:none; cursor:pointer; font-size:0.75rem; font-weight:700; flex-shrink:0; }
.toggle-btn.sim { background:#d4edda; color:#155724; }
.toggle-btn.nao { background:#f8d7da; color:#721c24; }

.price-input { width:80px; padding:6px 8px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:0.85rem; text-align:center; }
.price-input:focus { border-color:var(--purple); outline:none; }

.btn-save { padding:6px 12px; background:linear-gradient(135deg,var(--purple),var(--pink)); color:white; border:none; border-radius:var(--radius-sm); font-size:0.75rem; font-weight:700; cursor:pointer; }
.btn-del { padding:6px 10px; background:#fee2e2; color:#dc2626; border:1px solid #fecaca; border-radius:var(--radius-sm); font-size:0.75rem; cursor:pointer; margin-left:auto; }

.desc-area { padding:12px 16px; background:white; }
.desc-input { width:100%; padding:8px 12px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:0.85rem; resize:none; font-family:inherit; }
.desc-input:focus { border-color:var(--purple); outline:none; }
.desc-save { margin-top:8px; float:right; }

/* FORM NOVO PRODUTO */
.form-wrap { padding:16px; max-width:600px; }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:0.82rem; font-weight:700; color:var(--text); margin-bottom:5px; }
.form-input { width:100%; padding:10px 13px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:0.95rem; color:var(--text); font-family:inherit; }
.form-input:focus { border-color:var(--purple); outline:none; box-shadow:0 0 0 3px rgba(110,44,124,0.1); }

.tam-grid { display:grid; grid-template-columns:1fr 1fr 1fr 36px; gap:8px; margin-bottom:8px; align-items:center; }
.tam-grid input { padding:8px 10px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:0.85rem; font-family:inherit; width:100%; }
.tam-grid input:focus { border-color:var(--purple); outline:none; }
.btn-rm-tam { background:#fee2e2; color:#dc2626; border:1px solid #fecaca; border-radius:var(--radius-sm); cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; height:36px; }
.btn-add-tam { width:100%; padding:10px; background:var(--purple-light); color:var(--purple); border:2px dashed var(--purple); border-radius:var(--radius-sm); font-weight:700; font-size:0.9rem; cursor:pointer; margin-bottom:14px; }
.tam-labels { display:grid; grid-template-columns:1fr 1fr 1fr 36px; gap:8px; margin-bottom:4px; }
.tam-label-txt { font-size:0.72rem; color:var(--text-light); text-align:center; }

.upload-area { border:2px dashed var(--border); border-radius:var(--radius); padding:24px; text-align:center; cursor:pointer; position:relative; transition:border-color 0.2s; }
.upload-area:hover { border-color:var(--purple); }
.upload-area input { position:absolute; inset:0; opacity:0; cursor:pointer; }
.upload-text { color:var(--text-light); font-size:0.9rem; }
#img-preview { max-width:100%; max-height:160px; border-radius:var(--radius-sm); margin-top:12px; display:none; }
.upload-prog { display:none; color:var(--purple); font-weight:600; font-size:0.9rem; margin-top:8px; }

.btn-primary { width:100%; padding:13px; background:linear-gradient(135deg,var(--purple),var(--pink)); color:white; border:none; border-radius:var(--radius); font-size:1rem; font-weight:700; cursor:pointer; box-shadow:0 3px 12px rgba(110,44,124,0.35); }
.btn-primary:hover { opacity:.92; }
.btn-primary:disabled { opacity:.6; cursor:not-allowed; }

/* LOADING */
.loading { text-align:center; padding:48px 20px; color:var(--text-light); }
.loading-spinner { font-size:2rem; animation:spin 1s linear infinite; display:block; margin-bottom:8px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* MODAL SENHA */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(3px); z-index:200; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.ativo { display:flex; }
.modal-box { background:white; border-radius:20px; padding:28px 24px; width:100%; max-width:340px; text-align:center; animation:slideUp .3s ease; }
@keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
.modal-box h3 { color:var(--purple); font-size:1.1rem; margin-bottom:6px; }
.modal-box p { color:var(--text-light); font-size:0.85rem; margin-bottom:18px; }
.modal-box input { width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:1rem; text-align:center; margin-bottom:12px; font-family:inherit; }
.modal-box input:focus { border-color:var(--purple); outline:none; }
.modal-btn { width:100%; padding:12px; background:linear-gradient(135deg,var(--purple),var(--pink)); color:white; border:none; border-radius:var(--radius-sm); font-size:1rem; font-weight:700; cursor:pointer; }
.modal-erro { color:#dc2626; font-size:0.82rem; margin-top:8px; }
.modal-cancel { color:var(--text-light); font-size:0.82rem; margin-top:10px; cursor:pointer; display:block; }

/* TOAST */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(30px); background:#1f2937; color:white; padding:10px 20px; border-radius:50px; font-size:0.875rem; font-weight:600; z-index:9999; opacity:0; transition:transform .3s,opacity .3s; pointer-events:none; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.sucesso { background:#16a34a; }
.toast.erro { background:#dc2626; }
.toast.info { background:var(--purple); }

.empty-state { text-align:center; padding:32px 16px; color:var(--text-light); font-size:0.9rem; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-logo" id="titulo" onclick="cliqueTitulo()">🌿 TDA Açaí</div>
    <div class="topbar-sub">Painel Admin</div>
  </div>
</div>

<div class="tabs">
  <div class="tab ativo" id="tab-btn-produtos" onclick="mudarTab('produtos')">📋 Produtos</div>
  <div class="tab oculto" id="tab-btn-novo" onclick="mudarTab('novo')">➕ Novo Produto</div>
</div>

<!-- ABA PRODUTOS -->
<div class="tab-content ativo" id="tab-produtos">
  <div class="loading" id="loading">
    <span class="loading-spinner">🍇</span>
    Carregando produtos...
  </div>
  <div id="lista-produtos"></div>
</div>

<!-- ABA NOVO PRODUTO -->
<div class="tab-content" id="tab-novo">
  <div class="form-wrap">
    <div class="form-group">
      <label>Nome do Produto</label>
      <input type="text" id="novo-nome" class="form-input" placeholder="Ex: Copo Especial">
    </div>
    <div class="form-group">
      <label>Categoria</label>
      <select id="novo-cat" class="form-input">
        <option value="Copo Individual">Copo Individual</option>
        <option value="Combo">Combo</option>
        <option value="Garrafa">Garrafa</option>
      </select>
    </div>
    <div class="form-group">
      <label>Descrição</label>
      <textarea id="novo-desc" class="form-input" rows="2" placeholder="Ingredientes ou descrição"></textarea>
    </div>
    <div class="form-group">
      <label>Tamanhos e Preços</label>
      <div class="tam-labels">
        <span class="tam-label-txt">Tamanho</span>
        <span class="tam-label-txt">Preço (R$)</span>
        <span class="tam-label-txt">Preço Original</span>
        <span></span>
      </div>
      <div id="tamanhos"></div>
      <button class="btn-add-tam" onclick="addTam()">+ Adicionar Tamanho</button>
    </div>
    <div class="form-group">
      <label>Foto do Produto</label>
      <div class="upload-area" onclick="document.getElementById('file-in').click()">
        <div class="upload-text">📷 Toque para escolher uma foto</div>
        <input type="file" id="file-in" accept="image/*" onchange="previewImg(this)">
        <img id="img-preview">
      </div>
      <div class="upload-prog" id="upload-prog">⬆️ Enviando imagem...</div>
    </div>
    <button class="btn-primary" id="btn-salvar" onclick="salvarProduto()">✅ Salvar Produto</button>
  </div>
</div>

<!-- MODAL SENHA -->
<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h3>🔒 Área Restrita</h3>
    <p>Digite a senha para adicionar produtos</p>
    <input type="password" id="input-senha" placeholder="Senha" onkeydown="if(event.key==='Enter')verificarSenha()">
    <button class="modal-btn" onclick="verificarSenha()">Entrar</button>
    <div class="modal-erro" id="modal-erro"></div>
    <span class="modal-cancel" onclick="fecharModal()">Cancelar</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var WEBAPP_URL = ''; // será preenchido automaticamente
var SENHA_ADMIN = 'tda2024';
var imgBase64 = '', imgMime = '', imgNome = '';
var cliques = 0, timerCliques;

// Pega a URL do webapp automaticamente
try {
  WEBAPP_URL = window.location.href.split('?')[0];
} catch(e) {}

// ─── ACESSO SECRETO ──────────────────────────────────────────

function cliqueTitulo() {
  cliques++;
  clearTimeout(timerCliques);
  timerCliques = setTimeout(function() { cliques = 0; }, 2000);
  if (cliques >= 5) {
    cliques = 0;
    document.getElementById('modal-senha').classList.add('ativo');
    setTimeout(function() { document.getElementById('input-senha').focus(); }, 100);
  }
}

function verificarSenha() {
  var s = document.getElementById('input-senha').value;
  if (s === SENHA_ADMIN) {
    fecharModal();
    document.getElementById('tab-btn-novo').classList.remove('oculto');
    mudarTab('novo');
    toast('Bem-vindo, admin! 🌿', 'sucesso');
  } else {
    document.getElementById('modal-erro').textContent = 'Senha incorreta.';
  }
}

function fecharModal() {
  document.getElementById('modal-senha').classList.remove('ativo');
  document.getElementById('input-senha').value = '';
  document.getElementById('modal-erro').textContent = '';
}

// ─── TABS ────────────────────────────────────────────────────

function mudarTab(tab) {
  ['produtos','novo'].forEach(function(t) {
    document.getElementById('tab-btn-' + t).classList.toggle('ativo', t === tab);
    document.getElementById('tab-' + t).classList.toggle('ativo', t === tab);
  });
}

// ─── FETCH HELPER ────────────────────────────────────────────

function api(dados) {
  return fetch(WEBAPP_URL, {
    method: 'POST',
    body: JSON.stringify(dados)
  }).then(function(r) { return r.json(); });
}

// ─── CARREGAR PRODUTOS ───────────────────────────────────────

function carregarProdutos() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('lista-produtos').innerHTML = '';
  fetch(WEBAPP_URL + '?tipo=cardapio')
    .then(function(r) { return r.json(); })
    .then(renderProdutos)
    .catch(function(e) {
      document.getElementById('loading').textContent = 'Erro ao carregar produtos.';
    });
}

function renderProdutos(produtos) {
  document.getElementById('loading').style.display = 'none';
  var lista = document.getElementById('lista-produtos');

  if (!produtos || !produtos.length) {
    lista.innerHTML = '<div class="empty-state">Nenhum produto encontrado.</div>';
    return;
  }

  // Agrupar por nome
  var grupos = {};
  produtos.forEach(function(p) {
    if (!grupos[p.produto]) grupos[p.produto] = [];
    grupos[p.produto].push(p);
  });

  lista.innerHTML = '';
  Object.keys(grupos).forEach(function(nome) {
    var linhas = grupos[nome];
    var first = linhas[0];
    var card = document.createElement('div');
    card.className = 'prod-card';

    var imgHtml = first.imagem
      ? '<img class="prod-card-img" src="' + first.imagem + '" onerror="this.parentNode.innerHTML=\'<div class=prod-card-img-placeholder>🍇</div>\'">'
      : '<div class="prod-card-img-placeholder">🍇</div>';

    var sizesHtml = linhas.map(function(l) {
      return '<div class="size-row">' +
        '<span class="size-label">' + (l.tamanho || 'Único') + '</span>' +
        '<button class="toggle-btn ' + (l.disponivel ? 'sim' : 'nao') + '" onclick="toggleDisp(' + l.rowIndex + ', this)">' +
          (l.disponivel ? '✅ Sim' : '❌ Não') + '</button>' +
        '<span style="font-size:0.8rem;color:var(--text-light)">R$</span>' +
        '<input class="price-input" type="number" step="0.01" value="' + l.preco.toFixed(2) + '" id="preco-' + l.rowIndex + '">' +
        '<button class="btn-save" onclick="salvarPreco(' + l.rowIndex + ')">💾</button>' +
        '<button class="btn-del" onclick="deletarLinha(' + l.rowIndex + ', \'' + nome.replace(/'/g,'') + '\')">🗑️</button>' +
        '</div>';
    }).join('');

    card.innerHTML =
      '<div class="prod-card-header" onclick="toggleCard(this)">' +
        imgHtml +
        '<div class="prod-card-info">' +
          '<div class="prod-card-name">' + nome + '</div>' +
          '<div class="prod-card-cat">' + (first.categoria || '') + ' · ' + linhas.length + ' tamanho' + (linhas.length > 1 ? 's' : '') + '</div>' +
        '</div>' +
        '<span class="prod-card-chevron">▼</span>' +
      '</div>' +
      '<div class="prod-card-body">' +
        sizesHtml +
        '<div class="desc-area">' +
          '<label style="font-size:0.8rem;font-weight:700;color:var(--text-light);display:block;margin-bottom:6px;">Descrição</label>' +
          '<textarea class="desc-input" rows="2" id="desc-' + first.rowIndex + '">' + (first.descricao || '') + '</textarea>' +
          '<button class="btn-save desc-save" onclick="salvarDesc(' + first.rowIndex + ')">💾 Salvar descrição</button>' +
          '<div style="clear:both"></div>' +
        '</div>' +
      '</div>';

    lista.appendChild(card);
  });
}

function toggleCard(header) {
  header.parentElement.classList.toggle('aberto');
}

// ─── AÇÕES ───────────────────────────────────────────────────

function toggleDisp(rowIndex, btn) {
  api({ tipo: 'admin_toggle', rowIndex: rowIndex })
    .then(function() {
      var eSim = btn.classList.contains('sim');
      btn.className = 'toggle-btn ' + (eSim ? 'nao' : 'sim');
      btn.textContent = eSim ? '❌ Não' : '✅ Sim';
      toast('Disponibilidade atualizada!', 'sucesso');
    })
    .catch(function() { toast('Erro ao atualizar', 'erro'); });
}

function salvarPreco(rowIndex) {
  var val = document.getElementById('preco-' + rowIndex).value;
  var formatado = 'R$ ' + parseFloat(val).toFixed(2).replace('.', ',');
  api({ tipo: 'admin_update', rowIndex: rowIndex, colIndex: 3, valor: formatado })
    .then(function() { toast('Preço salvo!', 'sucesso'); })
    .catch(function() { toast('Erro ao salvar', 'erro'); });
}

function salvarDesc(rowIndex) {
  var val = document.getElementById('desc-' + rowIndex).value;
  api({ tipo: 'admin_update', rowIndex: rowIndex, colIndex: 6, valor: val })
    .then(function() { toast('Descrição salva!', 'sucesso'); })
    .catch(function() { toast('Erro ao salvar', 'erro'); });
}

function deletarLinha(rowIndex, nome) {
  if (!confirm('Excluir linha de "' + nome + '"?')) return;
  api({ tipo: 'admin_delete', rowIndex: rowIndex })
    .then(function() {
      toast('Excluído!', 'sucesso');
      setTimeout(carregarProdutos, 500);
    })
    .catch(function() { toast('Erro ao excluir', 'erro'); });
}

// ─── NOVO PRODUTO ────────────────────────────────────────────

function addTam() {
  var d = document.createElement('div');
  d.className = 'tam-grid';
  d.innerHTML =
    '<input type="text" placeholder="500ml" class="tam-t">' +
    '<input type="number" placeholder="26,00" step="0.01" class="tam-p">' +
    '<input type="number" placeholder="(opcional)" step="0.01" class="tam-po">' +
    '<button class="btn-rm-tam" onclick="rmTam(this)">✕</button>';
  document.getElementById('tamanhos').appendChild(d);
}

function rmTam(btn) {
  var lista = document.getElementById('tamanhos');
  if (lista.children.length > 1) btn.parentElement.remove();
}

function previewImg(input) {
  var file = input.files[0];
  if (!file) return;
  imgMime = file.type;
  imgNome = file.name;
  var r = new FileReader();
  r.onload = function(e) {
    imgBase64 = e.target.result.split(',')[1];
    var prev = document.getElementById('img-preview');
    prev.src = e.target.result;
    prev.style.display = 'block';
    document.querySelector('.upload-text').style.display = 'none';
  };
  r.readAsDataURL(file);
}

function salvarProduto() {
  var nome = document.getElementById('novo-nome').value.trim();
  var cat = document.getElementById('novo-cat').value;
  var desc = document.getElementById('novo-desc').value.trim();

  if (!nome) { toast('Informe o nome do produto', 'erro'); return; }

  var tamanhos = [];
  document.querySelectorAll('.tam-grid').forEach(function(linha) {
    var t = linha.querySelector('.tam-t').value.trim();
    var p = linha.querySelector('.tam-p').value;
    var po = linha.querySelector('.tam-po').value;
    if (t && p) tamanhos.push({ tamanho: t, preco: p, precoOriginal: po || '' });
  });

  if (!tamanhos.length) { toast('Adicione ao menos um tamanho e preço', 'erro'); return; }

  var btn = document.getElementById('btn-salvar');
  btn.disabled = true;

  function salvar(url) {
    api({ tipo: 'admin_save', produto: { produto: nome, categoria: cat, descricao: desc, tamanhos: tamanhos, imagem: url } })
      .then(function() {
        toast('Produto salvo! 🌿', 'sucesso');
        btn.disabled = false;
        limparForm();
        mudarTab('produtos');
        carregarProdutos();
      })
      .catch(function(e) { toast('Erro ao salvar', 'erro'); btn.disabled = false; });
  }

  if (imgBase64) {
    document.getElementById('upload-prog').style.display = 'block';
    api({ tipo: 'admin_upload', base64: imgBase64, nome: imgNome, mime: imgMime })
      .then(function(res) {
        document.getElementById('upload-prog').style.display = 'none';
        if (res.ok) salvar(res.url);
        else { toast('Erro no upload: ' + res.erro, 'erro'); btn.disabled = false; }
      })
      .catch(function() { toast('Erro no upload', 'erro'); btn.disabled = false; });
  } else {
    salvar('');
  }
}

function limparForm() {
  document.getElementById('novo-nome').value = '';
  document.getElementById('novo-desc').value = '';
  document.getElementById('tamanhos').innerHTML =
    '<div class="tam-grid">' +
    '<input type="text" placeholder="300ml" class="tam-t">' +
    '<input type="number" placeholder="18,90" step="0.01" class="tam-p">' +
    '<input type="number" placeholder="(opcional)" step="0.01" class="tam-po">' +
    '<button class="btn-rm-tam" onclick="rmTam(this)">✕</button>' +
    '</div>';
  document.getElementById('img-preview').style.display = 'none';
  document.querySelector('.upload-text').style.display = 'block';
  document.getElementById('file-in').value = '';
  imgBase64 = '';
}

// ─── TOAST ───────────────────────────────────────────────────

function toast(msg, tipo) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (tipo || '');
  setTimeout(function() { t.className = 'toast'; }, 2800);
}

  '<input type="text" placeholder="300ml" class="tam-t">' +
  '<input type="number" placeholder="18,90" step="0.01" class="tam-p">' +
  '<input type="number" placeholder="(opcional)" step="0.01" class="tam-po">' +
  '<button class="btn-rm-tam" onclick="rmTam(this)">✕</button>' +
  '</div>';

carregarProdutos();
</script>
